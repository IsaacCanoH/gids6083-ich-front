<form [formGroup]="form" (ngSubmit)="submit()">

  <!-- USERNAME -->
  <div class="mb-3">
    <label class="form-label fw-semibold" style="color: #0C2B4E;">
      Usuario
    </label>

    <div class="input-group">
      <span
        class="input-group-text"
        style="background-color: #F4F4F4; color: #1A3D64;"
      >
        <i class="bi bi-person"></i>
      </span>

      <input
        type="text"
        class="form-control"
        formControlName="username"
        placeholder="Usuario"
        (keydown)="blockSpace($event)"
        [class.is-invalid]="form.controls.username.touched && form.controls.username.invalid"
      />
    </div>

    <div *ngIf="form.controls.username.touched && form.controls.username.invalid">
      <small *ngIf="form.controls.username.errors?.['required']" class="text-danger">
        <i class="bi bi-exclamation-circle"></i> El usuario es obligatorio.
      </small>
      <small *ngIf="form.controls.username.errors?.['minlength']" class="text-danger">
        <i class="bi bi-exclamation-circle"></i> Mínimo 3 caracteres.
      </small>
      <small *ngIf="form.controls.username.errors?.['noSpaces']" class="text-danger">
        <i class="bi bi-exclamation-circle"></i> No se permiten espacios en blanco.
      </small>
    </div>
  </div>

  <!-- PASSWORD -->
  <div class="mb-3">
    <div class="d-flex justify-content-between mb-2">
      <label class="form-label fw-semibold mb-0" style="color: #0C2B4E;">
        Contraseña
      </label>
    </div>

    <div class="input-group">
      <span
        class="input-group-text"
        style="background-color: #F4F4F4; color: #1A3D64;"
      >
        <i class="bi bi-lock"></i>
      </span>

      <input
        [type]="showPassword() ? 'text' : 'password'"
        class="form-control"
        formControlName="password"
        placeholder="Contraseña"
        (keydown)="blockSpace($event)"
        [class.is-invalid]="form.controls.password.touched && form.controls.password.invalid"
      />

      <span
        class="input-group-text"
        style="background-color: #F4F4F4; color: #1A3D64; cursor: pointer;"
        (click)="togglePassword()"
      >
        <i
          class="bi"
          [ngClass]="showPassword() ? 'bi-eye' : 'bi-eye-slash'"
        ></i>
      </span>
    </div>

    <div *ngIf="form.controls.password.touched && form.controls.password.invalid">
      <small *ngIf="form.controls.password.errors?.['required']" class="text-danger">
        <i class="bi bi-exclamation-circle"></i> La contraseña es obligatoria.
      </small>
      <small *ngIf="form.controls.password.errors?.['minlength']" class="text-danger">
        <i class="bi bi-exclamation-circle"></i> Mínimo 3 caracteres.
      </small>
      <small *ngIf="form.controls.username.errors?.['noSpaces']" class="text-danger">
        <i class="bi bi-exclamation-circle"></i> No se permiten espacios en blanco.
      </small>
    </div>
  </div>

  <button
    type="submit"
    class="btn w-100 fw-semibold mt-3"
    style="background-color: #0C2B4E; color: #F4F4F4;"
    [disabled]="form.invalid"
  >
    Ingresar al sistema
  </button>

</form>
